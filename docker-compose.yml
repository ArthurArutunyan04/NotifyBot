version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-taskuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-task_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    networks:
      - backend

  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      JWT_SECRET: ${JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  task-service:
    build: ./task-service
    container_name: task-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - backend

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - kafka
    networks:
      - backend

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
    depends_on:
      - postgres
    networks:
      - backend

  telegram-bot:
    build: ./telegram-bot
    container_name: telegram-bot
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8085
      API_BASE_URL: http://api-gateway:8080
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - api-gateway
    networks:
      - backend

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - task-service
      - notification-service
      - analytics-service
    networks:
      - backend

  frontend:
    image: nginx:alpine
    container_name: frontend
    volumes:
      - ./webapp:/usr/share/nginx/html:ro
      - ./nginx/conf.d/frontend.conf:/etc/nginx/conf.d/frontend.conf:ro
    depends_on:
      - api-gateway
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api-gateway
      - telegram-bot
      - frontend
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge