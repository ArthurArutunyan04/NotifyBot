spring.application.name=api-gateway
server.port=8080
spring.cloud.gateway.enabled=true
spring.cloud.config.enabled=false
spring.profiles.active=

jwt.secret=4izvZR+2YQXQH21kTF/FsQtacW1z79eLOhKPMUicrdM=


spring.cloud.gateway.routes[0].id=task-service
spring.cloud.gateway.routes[0].uri=http://task-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/tasks/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/v1/tasks/(?<segment>.*),/api/api/v1/tasks/${segment}

spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=http://auth-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/v1/auth/(?<segment>.*),/api/v1/auth/${segment}
#spring.cloud.gateway.routes[1].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin

spring.cloud.gateway.routes[2].id=analytics-service
spring.cloud.gateway.routes[2].uri=http://analytics-service:8085
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/analytics/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=telegram-bot
spring.cloud.gateway.routes[3].uri=http://telegram-bot:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/telegram/**
#spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1
#    spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/v1/telegram/health,/health

spring.cloud.gateway.routes[4].id=actuator
spring.cloud.gateway.routes[4].uri=http://localhost:8080
spring.cloud.gateway.routes[4].predicates[0]=Path=/actuator/health
spring.cloud.gateway.routes[4].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.security.enabled=false

logging.level.root=INFO
logging.level.com.example.apigateway=DEBUG
logging.file.name=/app/logs/api-gateway.log
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.web=DEBUG
