spring.cloud.gateway.routes[0].id=telegram_route
spring.cloud.gateway.routes[0].uri=http://telegram-bot:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/telegram/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[1].id=task_route
spring.cloud.gateway.routes[1].uri=http://task-service:8081/api
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/tasks/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[2].id=auth_route
spring.cloud.gateway.routes[2].uri=http://auth-service:8082/api
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[3].id=notification_route
spring.cloud.gateway.routes[3].uri=http://notification-service:8083/api
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[4].id=analytics_route
spring.cloud.gateway.routes[4].uri=http://analytics-service:8084/api
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/analytics/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=2

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
security.ignored=/api/v1/telegram/health,/api/v1/tasks/health
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
logging.level.org.springframework=INFO
logging.level.com.notifybot=DEBUG
server.port=8080