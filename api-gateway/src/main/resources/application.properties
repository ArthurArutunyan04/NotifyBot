spring.application.name=api-gateway
server.port=8080
spring.cloud.gateway.enabled=true

spring.cloud.config.enabled=false

jwt.secret=yourVerySecretKey123456789013377

spring.cloud.gateway.routes[0].id=task-service
spring.cloud.gateway.routes[0].uri=http://task-service:8083
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/tasks/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[0].filters[1]=RemoveRequestHeader=Cookie

spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=http://auth-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin

spring.cloud.gateway.routes[2].id=analytics-service
spring.cloud.gateway.routes[2].uri=http://analytics-service:8085
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/analytics/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=telegram-service
spring.cloud.gateway.routes[3].uri=http://telegram-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/telegram/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.example.apigateway=DEBUG
logging.file.name=/app/logs/api-gateway.log