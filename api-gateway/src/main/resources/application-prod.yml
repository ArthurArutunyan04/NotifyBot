spring:
  cloud:
    gateway:
      routes:
        - id: task-service
          uri: http://task-service:8083
          predicates:
            - Path=/api/v1/tasks/**

        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/api/v1/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info