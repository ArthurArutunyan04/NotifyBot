<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotifyBot</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">
    <header>
        <div class="bot-name-container">
            <h1 class="bot-name">NotifyBot<span class="checkmark">✓</span></h1>
        </div>
    </header>
    <div class="content">
        <div class="tg-content" id="tgContent">
            <div class="button-container">
                <button class="action-btn" onclick="navigateTo('add-task.html')">Добавить задачу</button>
                <button class="action-btn" onclick="navigateTo('active-tasks.html')">Текущие задачи</button>
                <button class="action-btn" onclick="navigateTo('completed-tasks.html')">Выполненные задачи</button>
                <button class="action-btn" onclick="navigateTo('analytics.html')">Аналитика</button>
            </div>
            <a href="https://t.me/QwikTaskBot" class="btn mobile-btn back-button">Открыть бота</a>
        </div>
        <div class="mobile-content" id="mobileContent">
            <div class="button-container">
                <button class="action-btn" onclick="navigateTo('add-task.html')">Добавить задачу</button>
                <button class="action-btn" onclick="navigateTo('active-tasks.html')">Текущие задачи</button>
                <button class="action-btn" onclick="navigateTo('completed-tasks.html')">Выполненные задачи</button>
            </div>
            <a href="https://t.me/QwikTaskBot" class="btn mobile-btn back-button">Открыть бота</a>
        </div>
        <div class="desktop-content" id="desktopContent">
            <div class="button-container">
                <button class="action-btn" onclick="navigateTo('add-task.html')">Добавить задачу</button>
                <button class="action-btn" onclick="navigateTo('active-tasks.html')">Текущие задачи</button>
                <button class="action-btn" onclick="navigateTo('completed-tasks.html')">Выполненные задачи</button>
                <button class="action-btn" onclick="navigateTo('analytics.html')">Аналитика</button>
            </div>
            <a href="https://t.me/QwikTaskBot" class="btn mobile-btn back-button">Открыть бота</a>
        </div>
    </div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js" onload="initApp()"></script>
<script>
    function initApp() {
        const script1 = document.createElement('script');
        script1.src = 'js/api.js';
        document.body.appendChild(script1);
        script1.onload = () => {
            const script2 = document.createElement('script');
            script2.src = 'js/script.js';
            document.body.appendChild(script2);
        };
    }
</script>
</body>
</html>
