<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текущие задачи - NotifyBot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/active_tasks.css">
</head>
<body>
<div class="app-container">
    <header>
        <div class="bot-name-container">
            <h1 class="bot-name">Текущие задачи</h1>
        </div>
    </header>

    <div class="content">
        <div class="tasks-container" id="activeTasksContainer">
            <div class="task-item">
                <h3>Пример задачи</h3>
                <p>Описание задачи</p>
                <div class="task-meta">
                    <span class="due-date">До: 31.12.2023</span>
                    <button class="btn complete-btn">✓</button>
                </div>
            </div>
        </div>

        <button onclick="navigateTo('index.html')" class="btn back-btn">Назад</button>
    </div>
</div>
<script src="js/script.js"></script>
<script src="js/active-tasks.js"></script>
</body>
</html>
