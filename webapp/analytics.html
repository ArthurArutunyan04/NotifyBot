<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика - NotifyBot</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <style>
        .chart-container {
            margin-bottom: 40px;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        canvas {
            max-height: 300px;
        }
    </style>

</head>
<body>
<div class="app-container">
    <header>
        <div class="bot-name-container">
            <h1 class="bot-name">Аналитика</h1>
        </div>
    </header>

    <div class="content">
        <div class="chart-container">
            <h3>Распределение задач по статусам</h3>
            <canvas id="statusPieChart"></canvas>
        </div>

        <div class="chart-container">
            <h3>Время выполнения задач</h3>
            <canvas id="timeBarChart"></canvas>
        </div>

        <div class="chart-container">
            <h3>Распределение задач по статусам (в процентах)</h3>
            <canvas id="statusBarChart"></canvas>
        </div>

        <div class="chart-container">
            <h3>Активность по дням недели</h3>
            <canvas id="weeklyActivityChart"></canvas>
        </div>

        <button onclick="navigateTo('index.html')" class="btn back-btn">На главную</button>
    </div>
</div>

<script src="js/analytics.js"></script>
</body>
</html>
