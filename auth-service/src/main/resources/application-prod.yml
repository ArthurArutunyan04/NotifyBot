server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:task_db}
    username: ${DB_USER:taskuser}
    password: ${DB_PASSWORD:password123}

  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET:yourVerySecretKey123456789013377}
  expiration: 86400000

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}