server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/front.notify-task-bot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/front.notify-task-bot.ru/privkey.pem;

    return 404 "Default server: No matching server_name";
}