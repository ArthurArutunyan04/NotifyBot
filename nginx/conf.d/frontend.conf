server {
    listen 80;
    server_name front.notify-task-bot.ru notify-task-bot.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name front.notify-task-bot.ru notify-task-bot.ru;

    ssl_certificate /etc/letsencrypt/live/front.notify-task-bot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/front.notify-task-bot.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; connect-src 'self' https://api.notify-task-bot.ru https://web.notify-task-bot.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";

    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }

    location ~* (\.git/|wp-admin/|phpunit/|\.env|index\.php) {
        deny all;
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_except GET POST PUT DELETE OPTIONS {
            deny all;
        }
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
        proxy_redirect off;
        proxy_buffers 16 32k;
        proxy_buffer_size 32k;
    }
}