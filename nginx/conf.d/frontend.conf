server {
    listen 80;
    server_name front.notify-task-bot.ru *.notify-task-bot.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name front.notify-task-bot.ru *.notify-task-bot.ru;

    ssl_certificate /etc/letsencrypt/live/front.notify-task-bot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/front.notify-task-bot.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Debug-Frontend "Served by frontend.conf" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}