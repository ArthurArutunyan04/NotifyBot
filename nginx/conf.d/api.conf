server {
    listen 80;
    server_name api.notify-task-bot.ru;

    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host api.notify-task-bot.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
    }
}

server {
    listen 443 ssl;
    server_name api.notify-task-bot.ru;

    ssl_certificate /etc/letsencrypt/live/api.notify-task-bot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.notify-task-bot.ru/privkey.pem;

    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host api.notify-task-bot.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
    }
}